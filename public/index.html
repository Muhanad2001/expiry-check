<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#111827">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default">

  <title>فحص الصلاحية</title>

  <link
    rel="manifest"
    href="/manifest.json">

  <link
    rel="stylesheet"
    href="/style.css">

  <!-- قارئ الباركود و QR -->
  <script
    src="https://unpkg.com/html5-qrcode"
    defer>
  </script>

  <!-- OCR -->
  <script
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
    defer>
  </script>

</head>


<body>

<header>

  <div>

    <h1>
      فحص الصلاحية
    </h1>

    <p>
      إدارة المنتجات وتواريخ الانتهاء
    </p>

  </div>


  <div class="row">

    <button
      id="notifyBtn"
      class="ghost">
      🔔 تفعيل التنبيهات
    </button>

  </div>

</header>


<main>


<!-- ================================================= -->
<!-- الإحصائيات -->
<!-- ================================================= -->

<section class="stats">

  <div>
    <b id="total">0</b>
    <span>إجمالي المنتجات</span>
  </div>


  <div>
    <b id="soon">0</b>
    <span>تنتهي خلال 5 أيام</span>
  </div>


  <div>
    <b id="expired">0</b>
    <span>منتهية</span>
  </div>


  <div>
    <b id="qty">0</b>
    <span>إجمالي الكمية</span>
  </div>

</section>



<!-- ================================================= -->
<!-- إضافة منتج -->
<!-- ================================================= -->

<section class="card">

  <div class="row between">

    <h2>
      إضافة منتج
    </h2>


    <button
      id="scanBtn"
      class="secondary">

      ▣ مسح Barcode / QR

    </button>

  </div>



  <form id="productForm">

    <input
      type="hidden"
      id="id">



    <!-- الاسم والكمية -->

    <div class="grid">


      <label>

        اسم المنتج

        <input
          id="name"
          type="text"
          autocomplete="off"
          required
          placeholder="مثال: حليب نادك">

      </label>



      <label>

        الكمية

        <input
          id="quantity"
          type="number"
          min="0"
          value="1"
          required>

      </label>


    </div>



    <!-- ================================================= -->
    <!-- التاريخ -->
    <!-- ================================================= -->

    <label>

      تاريخ الانتهاء

      <input
        id="expiry"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        required
        placeholder="19/02/2027 أو 09/2028">

      <small style="
        display:block;
        margin-top:6px;
        color:#777;
        line-height:1.6;
      ">

        اكتب التاريخ بالعربي أو الإنجليزي،
        مثال: ١٩/٠٢/٢٠٢٧ أو 19/02/2027

      </small>

    </label>



    <!-- ================================================= -->
    <!-- قراءة EXP / E -->
    <!-- ================================================= -->

    <div
      style="
        margin-top:10px;
        display:flex;
        gap:8px;
        flex-wrap:wrap;
      ">


      <button
        type="button"
        id="ocrBtn"
        class="secondary">

        🔍 قراءة EXP / E من الصورة

      </button>


      <div
        id="ocrStatus"
        style="
          width:100%;
          font-size:14px;
          color:#666;
          margin-top:4px;
        ">

      </div>

    </div>



    <!-- ================================================= -->
    <!-- الباركود -->
    <!-- ================================================= -->

    <label>

      الباركود / QR

      <input
        id="barcode"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="سيُملأ تلقائياً عند المسح">

    </label>



    <!-- ================================================= -->
    <!-- صورة المنتج -->
    <!-- ================================================= -->

    <label>

      صورة المنتج

      <input
        id="image"
        type="file"
        accept="image/*"
        capture="environment">

    </label>



    <!-- معاينة الصورة -->

    <div
      id="preview">
    </div>



    <!-- ================================================= -->
    <!-- الملاحظات -->
    <!-- ================================================= -->

    <label>

      ملاحظات

      <textarea
        id="notes"
        rows="3"
        placeholder="اختياري"></textarea>

    </label>



    <!-- ================================================= -->
    <!-- الأزرار -->
    <!-- ================================================= -->

    <div class="actions">


      <button
        class="primary"
        type="submit">

        حفظ المنتج 💾

      </button>


      <button
        class="ghost"
        type="button"
        id="resetBtn">

        مسح الحقول

      </button>


    </div>

  </form>

</section>



<!-- ================================================= -->
<!-- المنتجات -->
<!-- ================================================= -->

<section class="card">


  <div class="row between">

    <h2>
      المنتجات 📋
    </h2>


    <div
      class="row">

      <input
        id="search"
        type="search"
        autocomplete="off"
        placeholder="بحث بالاسم أو الباركود">


      <button
        id="printBtn"
        class="secondary">

        🖨️ طباعة التقرير

      </button>

    </div>

  </div>



  <!-- التنبيهات -->

  <div
    id="alerts">
  </div>



  <!-- قائمة المنتجات -->

  <div
    id="products"
    class="products">

  </div>

</section>

</main>



<!-- ================================================= -->
<!-- نافذة الباركود -->
<!-- ================================================= -->

<div
  id="scanner"
  class="modal hidden">


  <div class="modalbox">


    <div class="row between">

      <h3>
        مسح الباركود / QR
      </h3>


      <button
        id="closeScan"
        type="button">

        ✕

      </button>

    </div>



    <!-- قارئ الكاميرا -->

    <div
      id="reader"
      style="
        width:100%;
        max-width:500px;
        margin:auto;
      ">
    </div>



    <p
      id="scanStatus"
      style="
        text-align:center;
        margin-top:12px;
      ">

      وجّه الكاميرا نحو الباركود...

    </p>


  </div>

</div>



<!-- ================================================= -->
<!-- app.js -->
<!-- ================================================= -->

<script
  src="/app.js">
</script>


</body>

</html>
