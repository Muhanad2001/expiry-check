<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#111827">

  <title>فحص الصلاحية</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h1>📦 فحص الصلاحية</h1>
    <p id="subtitle">إدارة المنتجات وتواريخ الانتهاء</p>
  </div>

  <div class="header-actions">
    <button id="langBtn" class="ghost">English</button>
    <button id="notifyBtn" class="ghost">🔔 التنبيهات</button>
  </div>
</header>

<main>

  <!-- الإحصائيات -->
  <section class="stats">

    <div class="stat-card">
      <b id="total">0</b>
      <span id="totalLabel">إجمالي المنتجات</span>
    </div>

    <div class="stat-card">
      <b id="soon">0</b>
      <span id="soonLabel">تنتهي خلال 5 أيام</span>
    </div>

    <div class="stat-card">
      <b id="expired">0</b>
      <span id="expiredLabel">منتهية</span>
    </div>

    <div class="stat-card">
      <b id="qty">0</b>
      <span id="qtyLabel">إجمالي الكمية</span>
    </div>

  </section>


  <!-- إضافة منتج -->
  <section class="card">

    <div class="row between">

      <h2 id="addTitle">➕ إضافة منتج</h2>

      <button id="scanBtn" class="secondary">
        📷 مسح Barcode / QR
      </button>

    </div>


    <form id="productForm">

      <input type="hidden" id="id">

      <div class="grid">

        <label>
          <span id="nameLabel">اسم المنتج</span>

          <input
            id="name"
            required
            placeholder="مثال: حليب نادك">
        </label>


        <label>
          <span id="quantityLabel">الكمية</span>

          <input
            id="quantity"
            type="number"
            min="0"
            value="1"
            required>
        </label>


        <label>
          <span id="expiryLabel">تاريخ الانتهاء</span>

          <input
            id="expiry"
            type="date"
            required>
        </label>


        <label>
          <span id="barcodeLabel">الباركود / QR</span>

          <input
            id="barcode"
            placeholder="سيظهر تلقائياً عند المسح">
        </label>

      </div>


      <!-- صورة المنتج -->
      <label>

        <span id="imageLabel">صورة المنتج</span>

        <input
          id="image"
          type="file"
          accept="image/*"
          capture="environment">

      </label>

      <div id="preview"></div>


      <!-- قراءة تاريخ الانتهاء -->
      <div class="ocr-box">

        <button
          type="button"
          id="ocrBtn"
          class="secondary">

          🔍 قراءة تاريخ الانتهاء من الصورة

        </button>

        <p id="ocrStatus"></p>

      </div>


      <!-- الملاحظات -->
      <label>

        <span id="notesLabel">ملاحظات</span>

        <textarea
          id="notes"
          rows="2"
          placeholder="اختياري"></textarea>

      </label>


      <div class="actions">

        <button
          class="primary"
          type="submit"
          id="saveBtn">

          💾 حفظ المنتج

        </button>


        <button
          class="ghost"
          type="button"
          id="resetBtn">

          مسح الحقول

        </button>

      </div>

    </form>

  </section>


  <!-- المنتجات -->
  <section class="card">

    <div class="row between">

      <h2 id="productsTitle">📋 المنتجات</h2>

      <div class="row">

        <input
          id="search"
          placeholder="بحث بالاسم أو الباركود">

        <button
          id="printBtn"
          class="secondary">

          🖨️ طباعة التقرير

        </button>

      </div>

    </div>


    <!-- التنبيهات -->
    <div id="alerts"></div>


    <!-- المنتجات -->
    <div
      id="products"
      class="products">

    </div>

  </section>

</main>


<!-- نافذة المسح -->
<div
  id="scanner"
  class="modal hidden">

  <div class="modalbox">

    <div class="row between">

      <h3 id="scannerTitle">
        📷 مسح الباركود / QR
      </h3>

      <button
        id="closeScan"
        class="ghost">

        ✕

      </button>

    </div>


    <div id="reader"></div>


    <p id="scanStatus">
      وجّه الكاميرا نحو الباركود...
    </p>

  </div>

</div>


<!-- مكتبة الباركود -->
<script src="https://unpkg.com/html5-qrcode"></script>


<!-- مكتبة قراءة النص من الصور -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<!-- كود الموقع -->
<script src="/app.js"></script>

</body>
</html>
