<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>فحص الصلاحية</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"></head><body>
<header><div><h1>فحص الصلاحية</h1><p>إدارة المنتجات وتواريخ الانتهاء</p></div><button id="notifyBtn" class="ghost">🔔 تفعيل التنبيهات</button></header>
<main>
<section class="stats"><div><b id="total">0</b><span>إجمالي المنتجات</span></div><div><b id="soon">0</b><span>تنتهي خلال 5 أيام</span></div><div><b id="expired">0</b><span>منتهية</span></div><div><b id="qty">0</b><span>إجمالي الكمية</span></div></section>
<section class="card"><div class="row between"><h2>إضافة منتج</h2><button id="scanBtn" class="secondary">▣ مسح Barcode / QR</button></div><form id="productForm"><input type="hidden" id="id"><div class="grid"><label>اسم المنتج<input id="name" required placeholder="مثال: حليب نادك"></label><label>الكمية<input id="quantity" type="number" min="0" value="1" required></label><label>تاريخ الانتهاء<input id="expiry" type="date" required></label><label>الباركود / QR<input id="barcode" placeholder="سيُملأ تلقائياً عند المسح"></label></div><label>صورة المنتج<input id="image" type="file" accept="image/*" capture="environment"></label><div id="preview"></div><label>ملاحظات<textarea id="notes" rows="2" placeholder="اختياري"></textarea></label><div class="actions"><button class="primary" type="submit">حفظ المنتج</button><button class="ghost" type="button" id="resetBtn">مسح الحقول</button></div></form></section>
<section class="card"><div class="row between"><h2>المنتجات</h2><div class="row"><input id="search" placeholder="بحث بالاسم أو الباركود"><button id="printBtn" class="secondary">🖨️ طباعة التقرير</button></div></div><div id="alerts"></div><div id="products" class="products"></div></section>
</main><div id="scanner" class="modal hidden"><div class="modalbox"><div class="row between"><h3>مسح الباركود / QR</h3><button id="closeScan">✕</button></div><video id="video" playsinline></video><p id="scanStatus">وجّه الكاميرا نحو الباركود...</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="/app.js"></script></body></html>
