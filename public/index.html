<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#111827">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default">

  <title>فحص الصلاحية</title>

  <link
    rel="manifest"
    href="/manifest.json">

  <link
    rel="stylesheet"
    href="/style.css">

  <!-- قارئ الباركود و QR -->
  <script
    src="https://unpkg.com/html5-qrcode"
    defer>
  </script>

  <!-- OCR -->
  <script
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
    defer>
  </script>

</head>


<body>

<header>

  <div>

    <h1>
      فحص الصلاحية
    </h1>

    <p>
      إدارة المنتجات وتواريخ الانتهاء
    </p>

  </div>


  <div class="row">

    <button
      id="notifyBtn"
      class="ghost">
      🔔 تفعيل التنبيهات
    </button>

  </div>

</header>


<main>


<!-- ================================================= -->
<!-- الإحصائيات -->
<!-- ================================================= -->

<section class="stats">

  <div>
    <b id="total">0</b>
    <span>إجمالي المنتجات</span>
  </div>


  <div>
    <b id="soon">0</b>
    <span>تنتهي خلال 5 أيام</span>
  </div>


  <div>
    <b id="expired">0</b>
    <span>منتهية</span>
  </div>


  <div>
    <b id="qty">0</b>
    <span>إجمالي الكمية</span>
  </div>

</section>



<!-- ================================================= -->
<!-- إضافة منتج -->
<!-- ================================================= -->

<section class="card">

  <div class="row between">

    <h2>
      إضافة منتج
    </h2>


    <button
      id="scanBtn"
      class="secondary">

      ▣ مسح Barcode / QR

    </button>

  </div>



  <form id="productForm">

    <input
      type="hidden"
      id="id">



    <!-- الاسم والكمية -->

    <div class="grid">


      <label>

        اسم المنتج

        <input
          id="name"
          type="text"
          autocomplete="off"
          required
          placeholder="مثال: حليب نادك">

      </label>



      <label>

        الكمية

        <input
          id="quantity"
          type="number"
          min="0"
          value="1"
          required>

      </label>


    </div>



    <!-- ================================================= -->
    <!-- التاريخ -->
    <!-- ================================================= -->

    <label>

      تاريخ الانتهاء

      <input
        id="expiry"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        required
        placeholder="19/02/2027 أو 09/2028">

      <small style="
        display:block;
        margin-top:6px;
        color:#777;
        line-height:1.6;
      ">

        اكتب التاريخ بالعربي أو الإنجليزي،
        مثال: ١٩/٠٢/٢٠٢٧ أو 19/02/2027

      </small>

    </label>



    <!-- ================================================= -->
    <!-- قراءة EXP / E -->
    <!-- ================================================= -->

    <div
      style="
        margin-top:10px;
        display:flex;
        gap:8px;
        flex-wrap:wrap;
      ">


      <button
        type="button"
        id="ocrBtn"
        class="secondary">

        🔍 قراءة EXP / E من الصورة

      </button>


      <div
        id="ocrStatus"
        style="
          width:100%;
          font-size:14px;
          color:#666;
          margin-top:4px;
        ">

      </div>

    </div>



    <!-- ================================================= -->
    <!-- الباركود -->
    <!-- ================================================= -->

    <label>

      الباركود / QR

      <input
        id="barcode"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="سيُملأ تلقائياً عند المسح">

    </label>



    <!-- ================================================= -->
    <!-- صورة المنتج -->
    <!-- ================================================= -->

    <label>

      صورة المنتج

      <input
        id="image"
        type="file"
        accept="image/*"
        capture="environment">

    </label>



    <!-- معاينة الصورة -->

    <div
      id="preview">
    </div>



    <!-- ================================================= -->
    <!-- الملاحظات -->
    <!-- ================================================= -->

    <label>

      ملاحظات

      <textarea
        id="notes"
        rows="3"
        placeholder="اختياري"></textarea>

    </label>



    <!-- ================================================= -->
    <!-- الأزرار -->
    <!-- ================================================= -->

    <div class="actions">


      <button
        class="primary"
        type="submit">

        حفظ المنتج 💾

      </button>


      <button
        class="ghost"
        type="button"
        id="resetBtn">

        مسح الحقول

      </button>


    </div>

  </form>

</section>



<!-- ================================================= -->
<!-- المنتجات -->
<!-- ================================================= -->

<section class="card">


  <div class="row between">

    <h2>
      المنتجات 📋
    </h2>


    <div
      class="row">

      <input
        id="search"
        type="search"
        autocomplete="off"
        placeholder="بحث بالاسم أو الباركود">


      <button
        id="printBtn"
        class="secondary">

        🖨️ طباعة التقرير

      </button>

    </div>

  </div>



  <!-- التنبيهات -->

  <div
    id="alerts">
  </div>



  <!-- قائمة المنتجات -->

  <div
    id="products"
    class="products">

  </div>

</section>

</main>



<!-- ================================================= -->
<!-- نافذة الباركود -->
<!-- ================================================= -->

<div
  id="scanner"
  class="modal hidden">


  <div class="modalbox">


    <div class="row between">

      <h3>
        مسح الباركود / QR
      </h3>


      <button
        id="closeScan"
        type="button">

        ✕

      </button>

    </div>



    <!-- قارئ الكاميرا -->

    <div
      id="reader"
      style="
        width:100%;
        max-width:500px;
        margin:auto;
      ">
    </div>



    <p
      id="scanStatus"
      style="
        text-align:center;
        margin-top:12px;
      ">

      وجّه الكاميرا نحو الباركود...

    </p>


  </div>

</div>



<!-- ================================================= -->
<!-- حماية ومعالجة حقل التاريخ -->
<!-- ================================================= -->

<script>

(function () {

  const expiry = document.getElementById("expiry");

  if (!expiry) return;


  // تحويل الأرقام العربية والفارسية إلى أرقام إنجليزية
  function normalizeArabicNumbers(value) {

    return String(value)
      .replace(/[٠-٩]/g, function (d) {
        return String("٠١٢٣٤٥٦٧٨٩".indexOf(d));
      })
      .replace(/[۰-۹]/g, function (d) {
        return String("۰۱۲۳۴۵۶۷۸۹".indexOf(d));
      });

  }


  // تنظيف التاريخ مع المحافظة على /
  function cleanDate(value) {

    value = normalizeArabicNumbers(value);

    // السماح فقط بالأرقام و /
    value = value.replace(/[^\d/]/g, "");

    // منع أكثر من / متتالية
    value = value.replace(/\/+/g, "/");

    // الحد الأقصى 10 خانات: 19/02/2027
    value = value.substring(0, 10);

    return value;

  }


  // إضافة الفواصل تلقائياً أثناء الكتابة
  function formatDate(value) {

    value = cleanDate(value);

    // إذا كتب المستخدم الأرقام بدون فواصل
    // يتم تحويلها إلى DD/MM/YYYY
    const digits = value.replace(/\//g, "");

    // إذا كانت 8 أرقام بالضبط
    // مثال: 19022027
    if (
      digits.length === 8 &&
      value.indexOf("/") === -1
    ) {

      return (
        digits.substring(0, 2) +
        "/" +
        digits.substring(2, 4) +
        "/" +
        digits.substring(4, 8)
      );

    }


    return value;

  }


  /*
   * مهم:
   * نتحكم بالكتابة من keydown حتى لا يقوم أي كود
   * آخر بتحويل / إلى أرقام.
   */

  expiry.addEventListener("keydown", function (event) {

    const allowedKeys = [
      "Backspace",
      "Delete",
      "ArrowLeft",
      "ArrowRight",
      "ArrowUp",
      "ArrowDown",
      "Tab",
      "Home",
      "End"
    ];


    // السماح بالأزرار العادية
    if (allowedKeys.includes(event.key)) {
      return;
    }


    // السماح بـ /
    if (
      event.key === "/" ||
      event.key === "-"
    ) {

      event.preventDefault();

      insertText(event.key === "-" ? "/" : "/");

      return;

    }


    // السماح بالأرقام الإنجليزية
    if (/^[0-9]$/.test(event.key)) {

      event.preventDefault();

      insertText(event.key);

      return;

    }


    // السماح بالأرقام العربية
    if (/^[٠-٩]$/.test(event.key)) {

      event.preventDefault();

      insertText(
        normalizeArabicNumbers(event.key)
      );

      return;

    }


    // منع أي حروف أخرى
    event.preventDefault();

  });


  function insertText(text) {

    const start = expiry.selectionStart ?? expiry.value.length;
    const end = expiry.selectionEnd ?? expiry.value.length;

    let value =
      expiry.value.substring(0, start) +
      text +
      expiry.value.substring(end);

    value = cleanDate(value);

    expiry.value = value;

    const newPosition =
      Math.min(
        start + text.length,
        expiry.value.length
      );

    expiry.setSelectionRange(
      newPosition,
      newPosition
    );

  }


  // دعم النسخ واللصق
  expiry.addEventListener("paste", function (event) {

    event.preventDefault();

    const pasted =
      event.clipboardData.getData("text");

    const start =
      expiry.selectionStart ?? expiry.value.length;

    const end =
      expiry.selectionEnd ?? expiry.value.length;


    let value =
      expiry.value.substring(0, start) +
      pasted +
      expiry.value.substring(end);


    value = formatDate(value);

    expiry.value = value;


    expiry.setSelectionRange(
      expiry.value.length,
      expiry.value.length
    );

  });


  /*
   * إذا جاء التاريخ من OCR أو من كود آخر،
   * نقوم بتنظيفه بدون حذف الفواصل.
   */
  expiry.addEventListener("change", function () {

    expiry.value =
      formatDate(expiry.value);

  });


  /*
   * دعم إدخال قيمة برمجياً من OCR.
   * نراقب القيمة فقط عندما تتغير من كود خارجي.
   */
  let lastValue = expiry.value;

  setInterval(function () {

    if (
      document.activeElement !== expiry &&
      expiry.value !== lastValue
    ) {

      const cleaned =
        formatDate(expiry.value);

      if (expiry.value !== cleaned) {
        expiry.value = cleaned;
      }

      lastValue = expiry.value;

    }

  }, 150);


  // عند إرسال النموذج، تأكد من أن التاريخ نظيف
  const form =
    document.getElementById("productForm");

  if (form) {

    form.addEventListener(
      "submit",
      function () {

        expiry.value =
          formatDate(expiry.value);

      },
      true
    );

  }


})();

</script>



<!-- ================================================= -->
<!-- app.js -->
<!-- ================================================= -->

<script
  src="/app.js">
</script>


</body>

</html>
